spring:
  application:
    name: ctms

  # Spec §5.1 — the runtime decision. Virtual threads give us the concurrency that
  # WebFlux would have cost us Hibernate and transaction-scoped RLS context to reach.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${CTMS_DB_URL:jdbc:postgresql://localhost:5432/ctms}
    username: ${CTMS_DB_USER:ctms}
    password: ${CTMS_DB_PASSWORD:ctms}
    hikari:
      maximum-pool-size: ${CTMS_DB_POOL_MAX:10}
      pool-name: ctms-pool

  jpa:
    open-in-view: false          # an open session in the view layer hides N+1 and leaks tx scope
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # exposes /actuator/health/{liveness,readiness}
      show-details: never        # §18.17 — health output is not an information leak

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: INFO
