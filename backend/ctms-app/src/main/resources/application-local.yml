# Local development against docker-compose.yml.
#
# The compose superuser (ctms) owns the schema and runs migrations; the application connects
# as ctms_app, which V5 creates. Running locally as the owner would mean developing against a
# database with no row-level security and discovering the difference in production.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ctms
    username: ctms_app
    # Must match the password V5 gives the role when it creates it on a fresh database.
    password: "cTms_4pp_S3cure!P@ssw0rd2026"
  flyway:
    user: ctms
    password: ctms
logging:
  level:
    org.flywaydb: DEBUG
