spring:
  application:
    name: ctms

  # Spec §5.1 — the runtime decision. Virtual threads give us the concurrency that
  # WebFlux would have cost us Hibernate and transaction-scoped RLS context to reach.
  threads:
    virtual:
      enabled: true

  # Two identities, deliberately (§7.7). The application pool connects as the unprivileged
  # ctms_app, which owns nothing and is therefore constrained by every policy. Migrations run
  # as the owner. Pointing the application at the owner would disable RLS everywhere at once,
  # silently — RlsConnectionGuard refuses to start if that happens.
  datasource:
    url: ${CTMS_DB_URL:jdbc:postgresql://localhost:5432/ctms}
    username: ${CTMS_DB_APP_USER:ctms_app}
    password: ${CTMS_DB_APP_PASSWORD:ctms_app}
    hikari:
      maximum-pool-size: ${CTMS_DB_POOL_MAX:10}
      pool-name: ctms-pool

  servlet:
    multipart:
      # §16.5 caps a document at 50 MB, and ck_documents_size enforces it. Spring's own
      # default is 1 MB, so without this a legitimate protocol fails as a 500 long before
      # the validator gets to explain why.
      max-file-size: 50MB
      max-request-size: 55MB
      # Spill to disk past this rather than holding the upload in heap. On a 24 GB VM a
      # handful of concurrent 50 MB uploads in memory is the difference between working
      # and an OutOfMemoryError.
      file-size-threshold: 256KB

  jpa:
    open-in-view: false          # an open session in the view layer hides N+1 and leaks tx scope
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The owner: creates tables, policies, grants, and the ctms_app role itself (V5).
    user: ${CTMS_DB_OWNER_USER:ctms}
    password: ${CTMS_DB_OWNER_PASSWORD:ctms}

# §18.2 — token design.
ctms:
  auth:
    # Intentionally has NO default. An application that cannot find a signing secret must
    # refuse to start rather than fall back to one committed to the repository.
    jwt-secret: ${CTMS_JWT_SECRET}
    access-token-ttl: ${CTMS_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${CTMS_JWT_REFRESH_TTL:14d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # exposes /actuator/health/{liveness,readiness}
      show-details: never        # §18.17 — health output is not an information leak

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: INFO
